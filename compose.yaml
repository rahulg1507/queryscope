services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      QUERYSCOPE_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 25s
      retries: 3

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
